[project]
name = "pipeline"
version = "0.1.0"
description = "Quarterly portfolio packs in, standard KPIs out"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",      # xlsx
    "pdfplumber>=0.11",   # pdf
    "python-docx>=1.1",   # docx
    "pyyaml>=6.0",        # yaml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = ["pytest>=8"]
